<!doctype html>
<html><head><meta charset="utf-8"><title>Fixture application</title></head>
<body>
<h1>Apply: Backend Developer (fixture)</h1>
<form id="f">
  <div><label for="fn">First Name *</label><input id="fn" name="first_name" required></div>
  <div><label for="ln">Last Name *</label><input id="ln" name="last_name" required></div>
  <div><label for="em">Email *</label><input id="em" type="email" name="email" required></div>
  <div><label for="ph">Phone *</label><input id="ph" type="tel" name="phone" required></div>
  <div><label for="co">Country *</label><select id="co" name="country" required><option value="">Select...</option><option>Germany</option><option>India</option><option>United States</option></select></div>
  <div><label for="cv">Resume/CV *</label><input id="cv" type="file" name="resume" required></div>
  <div><label for="gh">GitHub URL</label><input id="gh" name="github"></div>
  <fieldset><legend>Are you legally authorized to work in India? *</legend>
    <label><input type="radio" name="auth" value="yes" required> Yes</label>
    <label><input type="radio" name="auth" value="no"> No</label></fieldset>
  <div><label for="np">Notice period (in days) *</label><input id="np" name="notice_days" required></div>
  <div><label><input id="consent" type="checkbox" name="consent" required> I agree to the privacy policy</label></div>
  <button type="submit">Submit application</button>
</form>
<script>
// Plays the person: after a few seconds, answers what the agent left, records what
// the agent had done, ticks consent and submits. Never part of the agent.
const wait = Number(new URLSearchParams(location.search).get('autosubmit') || 0);
if (wait) setTimeout(() => {
  const seen = {
    fn: fn.value, em: em.value, co: co.value, auth: document.querySelector('[name=auth]:checked')?.value || '',
    cv: cv.files.length, consentByAgent: consent.checked, np: np.value,
  };
  np.value = '15';
  consent.checked = true;
  fetch('/seen', { method: 'POST', body: JSON.stringify(seen) }).finally(() => f.requestSubmit());
}, wait * 1000);
f.onsubmit = (e) => { e.preventDefault(); document.body.innerHTML = '<h1>Thank you for applying!</h1><p>Your application has been submitted.</p>'; };
</script>
</body></html>
